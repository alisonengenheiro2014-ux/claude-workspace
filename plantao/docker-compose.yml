services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: plantao
      POSTGRES_DB: plantao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantao"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  # transcrição de áudio local (sem custo por minuto); usa CPU da VPS
  whisper:
    # confira a tag mais recente em github.com/speaches-ai/speaches antes de subir
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
    restart: unless-stopped
    volumes:
      - whispercache:/home/ubuntu/.cache/huggingface

  # HTTPS automático para o webhook
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [app]

volumes:
  dbdata:
  whispercache:
  caddydata:
